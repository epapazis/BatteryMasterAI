name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

         # Installs Gradle directly, so the build works even if gradlew or the
      # wrapper .jar was lost during a browser upload.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Locate project folder
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git*" | head -100
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          ls -la "$dir" "$dir/app" || true

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        continue-on-error: true
        run: cd "$PROJECT_DIR" && gradle :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Prepare release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd "$PROJECT_DIR"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK + AAB
        continue-on-error: true
        run: cd "$PROJECT_DIR" && gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release files
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Remove signing files
        if: always()
        run: rm -f "$PROJECT_DIR/release.jks" "$PROJECT_DIR/keystore.properties"
